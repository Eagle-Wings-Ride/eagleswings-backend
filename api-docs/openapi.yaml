            format: binary

        car_insurance:
          type: array
          items:
            type: string
            format: binary

        criminal_check_rec:
          type: array
          items:
            type: string
            format: binary

        child_intervention_rec:
          type: array
          items:
            type: string
            format: binary

        driver_abstract:
          type: array
          items:
            type: string
            format: binary

        inspection_report:
          type: array
          items:
            type: string
            format: binary

    DriverRegisterRequest:
      type: object

      required:
        - fullname
        - email
        - password

      properties:

        fullname:
          type: string

        email:
          format: email

        password:
          type: string
          format: password

        phone_number:
          type: string

        residential_address:
          type: string


    Assignment:

