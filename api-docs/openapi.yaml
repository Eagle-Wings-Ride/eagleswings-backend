openapi: 3.0.3

info:
  title: Eagles Wings Ride API
  description: |
    API documentation for Eagles Wings Ride platform.

    Includes:
    - Admin portal
    - Driver authentication
    - Driver management
    - Ride lifecycle
    - Driver dashboard
    - Driver history
    - Driver shifts

  version: 1.0.0

servers:
  - url: http://localhost:3000/api/v1

    description: Production server
  
# https://eagles-wings-backend.onrender.com/api/v1

tags:
  - name: Admin Authentication
    description: |
      Endpoints for administrator account registration, email verification,
      login, and OTP management.

  - name: User Authentication
    description: |
      User registration, login, email verification,
      OTP management, and password recovery.

  - name: Driver Authentication
    description: |
      Driver registration, login, email verification,
      OTP management, and password recovery.

  - name: User Profile
    description: |
      Manage authenticated user information.

  - name: Children Management
    description: |
      Add and manage children associated with a user account.

  - name: Ride Booking
    description: |
      Create, update, and view ride bookings.

  - name: Payments
    description: |
      Handle Stripe checkout and booking renewals.

  - name: Driver Profile
    description: |
      Manage authenticated driver information.

  - name: Driver Documents
    description: |
      Upload and manage driver verification documents.

  - name: Assignments
    description: |
      Manage driver assignments for bookings, including assigning,
      accepting, rejecting, tracking, and completing rides.

  - name: Driver Shift
    description: |
      View and manage the authenticated driver's current work shift.

  - name: Driver History
    description: |
      View driving history, completed shifts, ride statistics,
      and performance metrics for the authenticated driver.

  - name: Admin Account Management
    description: |
      Manage user and driver accounts.
      View, update, and delete accounts as an administrator.

  - name: Admin Dashboard
    description: |
      Dashboard analytics and statistics available to authenticated administrators.

  - name: Driver Management
    description: |
      Approve drivers, assign rides, and unassign drivers from bookings.


components:

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: Invalid credentials

    SuccessResponse:
      type: object
      properties:
        message:
          type: string
          example: Operation completed successfully


    Admin:
      type: object

      properties:

        _id:
          type: string
          example: 68bfcb8fd2f97b3ac30ba278

        fullname:
          type: string
          example: John Doe

        email:
          type: string
          format: email
          example: admin@example.com

        isVerified:
          type: boolean
          example: true

        status:
          type: string
          enum:
            - active
            - suspended

        role:
          type: string
          enum:
            - admin
            - superadmin

        createdAt:
          type: string
          format: date-time
    
    AdminRegisterRequest:

      type: object

      required:
        - fullname
        - email
        - password

      properties:

        fullname:
          type: string
          minLength: 3
          maxLength: 50
          example: John Admin

        email:
          type: string
          format: email
          example: admin@example.com

        password:
          type: string
          minLength: 6
          example: Eagles123
    
    AdminLoginRequest:

      type: object

      required:
        - email
        - password

      properties:

        email:
          type: string
          format: email
          example: admin@example.com

        password:
          type: string
          example: Eagles123
    
    
    AdminVerifyOtpRequest:

      type: object

      required:
        - email
        - otp

      properties:

        email:
          type: string
          format: email
          example: admin@example.com

        otp:
          type: string
          example: "174584"


    AdminResendOtpRequest:

      type: object

      required:
        - email

      properties:

        email:
          type: string
          format: email
          example: admin@example.com


    Driver:
      type: object

      properties:

        _id:
          type: string

        fullname:
          type: string

        email:
          type: string

        phone_number:
          type: string

        age:
          type: string

        image:
          type: string

        residential_address:
          type: string

        preferred_route:
          type: string

        reasons:
          type: string
          example: Experienced school transportation driver


        car_insurance:
          type: string
          example: https://storage.example.com/car-insurance.pdf


        driver_license:
          type: string
          example: https://storage.example.com/license.pdf


        criminal_check_rec:
          type: string
          example: https://storage.example.com/criminal-check.pdf


        child_intervention_rec:
          type: string
          example: https://storage.example.com/intervention-record.pdf


        driver_abstract:
          type: string
          example: https://storage.example.com/driver-abstract.pdf


        inspection_report:
          type: string
          example: https://storage.example.com/inspection-report.pdf


        isEmailVerified:
          type: boolean


        isDriverApproved:
          type: boolean


        status:
          type: string
          enum:
            - driving
            - unavailable
            - online
            - offline

        current_latitude:
          type: number

        current_longitude:
          type: number


        start_latitude:
          type: number

        start_longitude:
          type: number

        end_latitude:
          type: number

        end_longitude:
          type: number


        createdAt:
          type: string
          format: date-time


        updatedAt:
          type: string
          format: date-time


    UpdateDriverRequest:
      type: object
      properties:

        fullname:
          type: string

        phone_number:
          type: string

        age:
          type: string

        residential_address:
          type: string

        preferred_route:
          type: string

        reasons:
          type: string


    DriverUploadDetailsRequest:
