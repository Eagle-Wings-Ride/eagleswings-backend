  /book/rides/make-payment:

    post:

      tags:
        - Payments

      summary: Create Stripe checkout session

      description: |
        Creates a Stripe Checkout session for an existing booking.
        The booking must belong to the authenticated user and be eligible for payment.

      security:
        - bearerAuth: []

      requestBody:

        required: true

        content:

          application/json:

            schema:

              type: object

              required:
                - bookingId
                - currency

              properties:

                bookingId:
                  type: string
                  example: 68bfcb8fd2f97b3ac30ba278

                currency:
                  type: string
                  example: cad
                  enum:
                    - cad

      responses:

        200:

          description: Checkout session created successfully

          content:

            application/json:

              schema:

                type: object

                properties:

                  message:
                    type: string
                    example: Checkout session created successfully

                  url:
                    type: string
                    example: https://checkout.stripe.com/c/pay/cs_test_xxxxxxxxx

        400:

          description: Invalid request or booking not eligible for payment

          content:

            application/json:

              schema:
                $ref: '#/components/schemas/ErrorResponse'

        403:

          description: Unauthorized access

          content:

            application/json:

              schema:
                $ref: '#/components/schemas/ErrorResponse'

        404:

          description: Booking not found

          content:

            application/json:

              schema:
                $ref: '#/components/schemas/ErrorResponse'


  /book/rides/renew-payment:

    post:

      tags:
        - Payments

      summary: Renew an existing booking

      description: |
        Creates a Stripe Checkout session to renew an eligible booking.
        Renewal is only allowed within three days of the booking's service end date.

      security:
        - bearerAuth: []

      requestBody:

        required: true

        content:

          application/json:

            schema:

              type: object

              required:
                - bookingId
                - currency

              properties:

                bookingId:
                  type: string
                  example: 68bfcb8fd2f97b3ac30ba278

                currency:
                  type: string
                  enum:
                    - cad
                  example: cad

      responses:

        200:

          description: Renewal checkout session created successfully

          content:

            application/json:

              schema:

                type: object

                properties:

                  message:
                    type: string
                    example: Renewal checkout session created

                  url:
                    type: string
                    example: https://checkout.stripe.com/c/pay/cs_test_xxxxxxxxx

        400:

          description: Booking is not eligible for renewal

          content:

            application/json:

              schema:
                $ref: '#/components/schemas/ErrorResponse'

        403:

          description: Unauthorized access

          content:

            application/json:

              schema:
                $ref: '#/components/schemas/ErrorResponse'

        404:

          description: Booking not found

          content:

            application/json:

              schema:
                $ref: '#/components/schemas/ErrorResponse'               


