paths:
  /admin/register:

    post:

      tags:
        - Admin Authentication

      summary: Register Admin Account

      description: |
        Creates a new administrator account.
        
        After successful registration, an OTP is generated and sent
        to the provided email address for verification.

      requestBody:

        required: true

        content:

          application/json:

            schema:

              $ref: '#/components/schemas/AdminRegisterRequest'


      responses:

        '201':

          description: Admin registered successfully

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/SuccessResponse'


        '400':

          description: Missing required fields

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'


        '409':

          description: Email already exists

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'


        '500':

          description: Registration failed

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'
  
  
  /admin/login:

    post:

      tags:
        - Admin Authentication

      summary: Login Admin

      description: |
        Authenticates an administrator and returns a JWT token.

      requestBody:

        required: true

        content:

          application/json:

            schema:

              $ref: '#/components/schemas/AdminLoginRequest'


      responses:

        '200':

          description: Login successful

          content:

            application/json:

              schema:

                type: object

                properties:

                  message:

                    type: string

                    example: Login successful

                  token:

                    type: string

                    example: eyJhbGciOiJIUzI1NiIs...


        '400':

          description: Missing email or password

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'


        '401':

          description: Invalid credentials or email not verified

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'


        '500':

          description: Internal server error

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'

  /admin/verify-mail:

    post:

      tags:

        - Admin Authentication


      summary: Verify Admin Email Using OTP


      description: |
        Verifies the administrator email address using the OTP
        sent during registration.


      requestBody:

        required: true

        content:

          application/json:

            schema:

              $ref: '#/components/schemas/AdminVerifyOtpRequest'


      responses:

        '200':

          description: OTP verified successfully

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/SuccessResponse'


        '400':

          description: Invalid email or expired OTP

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'


        '500':

          description: OTP verification failed

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'

  /admin/resend-otp:

    post:

      tags:

        - Admin Authentication


      summary: Resend Admin OTP


      description: |
        Generates and sends a new OTP to an unverified administrator account.

      requestBody:

        required: true

        content:

          application/json:

            schema:

              $ref: '#/components/schemas/AdminResendOtpRequest'


      responses:

        '200':

          description: OTP resent successfully

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/SuccessResponse'


        '400':

          description: Admin already verified

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'


        '404':

          description: Admin not found

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'


        '500':

          description: Failed to resend OTP

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'


  /admin/dashboard/:

    get:

      tags:

        - Admin Dashboard


      summary: Get Admin Dashboard Statistics


      description: |
        Returns platform statistics available to authenticated administrators.

        Includes:
        - Driver statistics
        - Ride activity
        - Booking statistics
        - User statistics


      security:

        - bearerAuth: []


      responses:


        '200':

          description: Dashboard statistics retrieved successfully

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/AdminDashboard'



        '401':

          description: Unauthorized - Missing or invalid authentication token

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'

        '500':

          description: Failed to retrieve dashboard data

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'


  /admin/dashboard/users:

    get:

      tags:

        - Admin Dashboard

      summary: Get Admin Users Dashboard

      description: |
        Returns user-related statistics and information available to administrators.

        Includes:
        - Total users
        - Verified and unverified users
        - Total children
        - Users without bookings
        - Recent users
        - Users with children statistics
        - Recent bookings by users

      security:

        - bearerAuth: []

      responses:

        '200':

          description: User dashboard data retrieved successfully

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/AdminUserDashboard'


        '401':

          description: Unauthorized - Missing or invalid authentication token

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'


        '500':

          description: Failed to retrieve user dashboard data

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'


  /admin/dashboard/drivers:

    get:

      tags:

        - Admin Dashboard

      summary: Get Admin Drivers Dashboard

      description: |
        Returns driver-related statistics and operational information.

        Includes:
        - Total drivers
        - Approved drivers
        - Pending drivers
        - Online drivers
        - Active shifts
        - Current active rides
        - Recently registered drivers

      security:

        - bearerAuth: []

      responses:

        '200':

          description: Driver dashboard data retrieved successfully

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/AdminDriverDashboard'


        '401':

          description: Unauthorized - Missing or invalid authentication token

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'


        '500':

          description: Failed to retrieve driver dashboard data

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'


  /admin/dashboard/bookings:

    get:

      tags:

        - Admin Dashboard

      summary: Get Admin Bookings Dashboard

      description: |
        Returns booking statistics and booking management information.

        Includes:
        - Total bookings
        - Paid bookings
        - Assigned bookings
        - Cancelled bookings
        - Expired bookings
        - Pending payments
        - Unassigned bookings
        - Active bookings
        - Upcoming assignments

      security:

        - bearerAuth: []

      responses:

        '200':

          description: Booking dashboard data retrieved successfully

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/AdminBookingDashboard'


        '401':

          description: Unauthorized - Missing or invalid authentication token

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'


        '500':

          description: Failed to retrieve booking dashboard data

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'


  /admin/dashboard/rides:

    get:

      tags:

        - Admin Dashboard

      summary: Get Admin Rides Dashboard

      description: |
        Returns ride operations statistics and live ride information.

        Includes:
        - Rides today
        - Completed rides
        - Active rides
        - Cancelled rides
        - Pending rides
        - Current rides with drivers
        - Recently completed rides
        - Active drivers
        - Waiting assignments

      security:

        - bearerAuth: []

      responses:

        '200':

          description: Ride dashboard data retrieved successfully

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/AdminRideDashboard'


        '401':

          description: Unauthorized - Missing or invalid authentication token

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'


        '500':

          description: Failed to retrieve ride dashboard data

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'


  /admin/approve-driver/{id}:

    patch:

      tags:

        - Driver Management


      summary: Approve or Disapprove Driver


      description: |
        Allows an authenticated administrator to approve or disapprove a driver application.

        The driver approval status is updated using the is_approved field.


      security:

        - bearerAuth: []


      parameters:

        - name: id

          in: path

          required: true

          description: Driver ID

          schema:

            type: string

            example: 67ec7667a21bbffa6f499cf4


      requestBody:

        required: true

        content:

          application/json:

            schema:

              type: object

              required:

                - is_approved

              properties:

                is_approved:

                  type: boolean

                  example: true



      responses:


        '200':

          description: Driver approval status updated successfully

          content:

            application/json:

              schema:

                type: object

                properties:

                  message:

                    type: string

                    example: Driver has been approved!

                  driver:

                    $ref: '#/components/schemas/Driver'



        '400':

          description: Invalid approval value

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'



        '401':

          description: Unauthorized

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'



        '403':

          description: Forbidden - User is not an admin

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'



        '404':

          description: Driver or admin not found

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'



        '500':

          description: Server error

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'
  

  /admin/bookings/{bookingId}/assign-driver:

    patch:

      tags:

        - Driver Management


      summary: Assign Driver To Booking


      description: |
        Assigns an approved driver to a booking.
        
        Creates a pending assignment that requires driver acceptance.


      security:

        - bearerAuth: []


      parameters:

        - name: bookingId

          in: path

          required: true

          description: Booking ID

          schema:

            type: string

            example: 68bfd244d2f97b3ac30ba293



      requestBody:

        required: true

        content:

          application/json:

            schema:

              type: object

              required:

                - driverId


              properties:

                driverId:

                  type: string

                  example: 6907ece095bc7e2a3d62be46


                shift:

                  type: string

                  enum:

                    - morning
                    - afternoon

                  example: morning



      responses:


        '200':

          description: Driver assignment created

          content:

            application/json:

              schema:

                type: object

                properties:

                  message:

                    type: string

                    example: Driver assignment created (pending driver response)


                  assignment:

                    $ref: '#/components/schemas/Assignment'


        '400':

          description: Invalid booking, driver, or shift


          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'


        '401':

          description: Unauthorized


          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'


        '404':

          description: Booking or driver not found


          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'


        '500':

          description: Server error


          content:

            application/json:

              schema:

                $ref: '#/components/schemas/ErrorResponse'


  /admin/bookings/{bookingId}/unassign-driver:

    patch:

      tags:

        - Driver Management


      summary: Unassign Driver From Booking


      description: |
