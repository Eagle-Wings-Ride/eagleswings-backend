        tripDistanceMeters:
          type: number

        durationMinutes:
          type: number

        acceptedAt:
          type: string
          format: date-time

        completedAt:
          type: string
          format: date-time

        cancelledAt:
          type: string
          format: date-time

        createdAt:
          type: string
          format: date-time

        updatedAt:
          type: string
          format: date-time


    DriverShift:

