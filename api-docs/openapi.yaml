      responses:

        200:

          description: OTP resent successfully


  /drivers/password-reset/verify:

    post:

      tags:
        - Driver Authentication

      summary: Verify password reset OTP


      requestBody:

        required: true

        content:

          application/json:

            schema:
              $ref: '#/components/schemas/OTPRequest'


      responses:

        200:

          description: OTP verified successfully


  /drivers/password-reset/reset:

    post:

      tags:
        - Driver Authentication

      summary: Reset driver password


      requestBody:

        required: true

        content:

          application/json:

            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'


      responses:

        200:

          description: Password reset successfully


  /drivers/change-password:

    post:

      tags:
        - Driver Authentication

      summary: Change driver password


      security:
        - bearerAuth: []


      requestBody:

        required: true

        content:

          application/json:

            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'


      responses:

        200:

          description: Password changed successfully


  /drivers/upload-details/{id}:

    patch:

      tags:
        - Driver Documents

      summary: Upload driver documents

      description: |
        Upload driver verification documents and profile image.

      security:
        - bearerAuth: []

      parameters:

        - in: path
          name: id
          required: true

          schema:

            type: string


      requestBody:

        required: true

        content:

          multipart/form-data:

            schema:

              $ref: '#/components/schemas/DriverUploadDetailsRequest'


      responses:

        200:

          description: Driver documents uploaded successfully

          content:

            application/json:

              schema:

                type: object

                properties:

                  success:

                    type: boolean


                  message:

                    type: string


                  updatedDriver:

                    $ref: '#/components/schemas/Driver'


        400:

          description: No file uploaded


        404:

          description: Driver not found


  /drivers/me:

    get:

      tags:
        - Driver Profile

      summary: Get current authenticated driver

      description: |
        Retrieves the profile information of the currently authenticated driver.
        The driver is identified from the JWT token.

      security:
        - bearerAuth: []

      responses:

        200:
          description: Current driver retrieved successfully

          content:
            application/json:

              schema:
                type: object

                properties:

                  driver:
                    $ref: '#/components/schemas/Driver'


        401:
          description: Unauthorized


        404:
          description: Driver not found


        500:
          description: Server error

    patch:

        tags:
          - Driver Profile

        summary: Update driver profile

        description: |
          Updates editable driver information.
          Sensitive fields such as password,
          approval status, verification status,
          and account tokens cannot be updated here.

        security:
          - bearerAuth: []

        requestBody:

          required: true

          content:

            application/json:

              schema:

                $ref: '#/components/schemas/UpdateDriverRequest'


        responses:

          200:

            description: Driver updated successfully

            content:

              application/json:

                schema:

                  $ref: '#/components/schemas/Driver'


          404:

            description: Driver not found

  /drivers/viewRides:

    get:

      tags:
        - Driver Profile

      summary: View driver's assigned rides

      description: |
        Retrieves rides assigned to the authenticated driver
        including booking and child information.

      security:
        - bearerAuth: []

      responses:

        200:

          description: Driver rides retrieved successfully

          content:

            application/json:

              schema:

                type: object

                properties:

                  driver:

                    $ref: '#/components/schemas/Driver'


                  rides:

                    type: array

                    items:

                      type: object

                      properties:

                        assignmentId:

                          type: string


                        assignmentStatus:

                          type: string


                        booking:

                          type: object


        404:

          description: Driver not found

  /driver-shift/active:
    get:
      tags:
        - Driver Shift

      summary: View active driver shift

      description: |
        Returns the authenticated driver's currently active shift.
        If no shift is active, the response returns `shift: null`.

      security:
        - bearerAuth: []

      responses:
        "200":
          description: Active shift retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  shift:
                      $ref: "#/components/schemas/DriverShift"
                      nullable: true

        "401":
          description: Unauthorized

        "500":
          description: Server error

  /driver-shift/end:
    patch:
      tags:
        - Driver Shift

      summary: End current driver shift

      description: |
        Ends the authenticated driver's active shift.

        A shift cannot be ended while the driver still has active ride assignments.

      security:
        - bearerAuth: []

      responses:
        "200":
          description: Shift completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Shift completed

                  shift:
                    $ref: "#/components/schemas/DriverShift"

        "400":
          description: Cannot end shift or shift already processed

        "401":
          description: Unauthorized

        "404":
          description: No active shift found

        "500":
          description: Server error


  /driver-history/me:
    get:
      tags:
        - Driver History

      summary: View my driving history

      description: |
        Returns all history records for the authenticated driver,
        sorted from newest to oldest.

      security:
        - bearerAuth: []

      responses:
        "200":
          description: Driver history retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer

                  history:
                    type: array
                    items:
                      $ref: "#/components/schemas/DriverHistory"

        "401":
          description: Unauthorized

        "500":
          description: Server error


  /driver-history/period/{periodType}/{year}/{period}:
    get:
      tags:
        - Driver History

      summary: View history for a specific period

      description: |
        Returns the authenticated driver's history for a specific
        day, week, month, or year.

      security:
        - bearerAuth: []

      parameters:
        - in: path
          name: periodType
          required: true
          schema:
            type: string
            enum:
              - day
              - week
              - month
              - year

        - in: path
          name: year
          required: true
          schema:
            type: integer
            example: 2026

        - in: path
          name: period
          required: true
          schema:
            type: integer
            example: 7

      responses:
        "200":
          description: History retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  history:
                    $ref: "#/components/schemas/DriverHistory"

        "401":
          description: Unauthorized

        "404":
          description: History not found

        "500":
          description: Server error     




